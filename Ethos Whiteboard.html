document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

text-anchor=\"middle\">mission<\u002Ftext><text x=\"75\" y=\"207\" font-family=\"Kalam\" font-size=\"19\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">Architect<\u002Ftext><text x=\"325\" y=\"207\" font-family=\"Kalam\" font-size=\"19\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">Advisor<\u002Ftext><text x=\"115\" y=\"332\" font-family=\"Kalam\" font-size=\"19\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">Mentor<\u002Ftext><text x=\"285\" y=\"332\" font-family=\"Kalam\" font-size=\"19\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">Connector<\u002Ftext><text x=\"200\" y=\"391\" font-family=\"Kalam\" font-size=\"15\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">shared platform · standards · security<\u002Ftext><\u002Fsvg>\n  <\u002Fdiv>\n  <div style=\"margin:0 64px 72px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px\"><div style=\"font:400 22px/1.2 'Permanent Marker',cursive;color:#1a1a1a;transform:rotate(-1.5deg)\">four parts of the job<\u002Fdiv><div style=\"width:190px;padding:18px 16px 24px;background:#f8bbd0;box-shadow:2px 5px 10px rgba(0,0,0,.16);transform:rotate(3deg);font:400 19px/1.3 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty;margin-bottom:-28px;position:relative;z-index:1\">Translate both ways: mission → tech, tech → mission.<\u002Fdiv><\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 772 10\" width=\"100%\" height=\"10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" stroke-linecap=\"round\" style=\"display:block;margin-top:10px;filter:url(#wb)\"><path d=\"M2 6c200-5 400-6 768-1\"><\u002Fpath><\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px;margin-top:32px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:url(#wb)\"><path d=\"M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font:400 24px/1.1 'Permanent Marker',cursive\">Architect<\u002Fdiv>\n        <p style=\"margin:0;font:400 17px/1.5 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">Owns the architecture on behalf of the organization. Starts simple, keeps technical debt visible, and makes sure what exists keeps earning its place.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:url(#wb)\"><path d=\"M4 4h16v11h-9l-4 4v-4H4zM8 9h8M8 12h5\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font:400 24px/1.1 'Permanent Marker',cursive\">Advisor<\u002Fdiv>\n        <p style=\"margin:0;font:400 17px/1.5 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">Brings technical judgment to leadership. Challenges the direction when it is wrong, and helps find the alternative when a path is blocked.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:url(#wb)\"><path d=\"M3 20h5v-5h5v-5h5V5h3M6 17.5v.01M11 12.5v.01M16 7.5v.01\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font:400 24px/1.1 'Permanent Marker',cursive\">Mentor<\u002Fdiv>\n        <p style=\"margin:0;font:400 17px/1.5 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">Develops the technical leaders who come next. Gives teams room to experiment and carries the accountability when something fails.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:url(#wb)\"><path d=\"M3 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M17 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M10 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 6h10M6 8l5 8M18 8l-5 8\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font:400 24px/1.1 'Permanent Marker',cursive\">Connector<\u002Fdiv>\n        <p style=\"margin:0;font:400 17px/1.5 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">Links technology to the mission and the people doing it. Proves what works, then standardizes it so others can use it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><div style=\"margin:0 64px 14px;font:400 22px/1.2 'Permanent Marker',cursive;color:#1a1a1a;transform:rotate(-1.5deg);display:inline-block;margin-left:64px\">ethos · 10 principles<\u002Fdiv><div style=\"margin:0 64px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1.5px solid #9aa0a8;border-left:1.5px solid #9aa0a8\">\n    <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"10\">\n      <div style=\"padding:18px 16px 22px;border-right:1.5px solid #9aa0a8;border-bottom:1.5px solid #9aa0a8;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:url(#wb)\"><path d=\"{{ s.d }}\"><\u002Fpath><\u002Fsvg><span style=\"font:400 16px/1 'Permanent Marker',cursive;color:#1a1a1a\">{{ s.num }}<\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 15px/1.3 'Kalam',cursive;text-wrap:pretty\">{{ s.title }}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"10\">\n    <div style=\"padding:104px 64px 0;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <svg data-draw=\"\" sc-camel-view-box=\"0 0 120 120\" width=\"100%\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:block;filter:url(#wb)\"><sc-for list=\"{{ s.wb }}\" as=\"a\" hint-placeholder-count=\"1\"><path d=\"{{ a.d }}\" stroke=\"{{ a.k }}\" stroke-width=\"{{ a.w }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>\n        <sc-if value=\"{{ s.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin:24px 0 0 20px;width:176px;padding:18px 16px 24px;background:{{ s.noteBg }};box-shadow:2px 5px 10px rgba(0,0,0,.16);transform:{{ s.noteRot }};font:400 19px/1.3 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">{{ s.note }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;font:400 40px/1.15 'Permanent Marker',cursive;max-width:540px;text-wrap:pretty\">{{ s.title }}<\u002Fh2>\n        <p style=\"margin:32px 0 0;font:700 23px/1.4 'Kalam',cursive;max-width:560px;text-wrap:pretty\"><sc-for list=\"{{ s.ledeSegs }}\" as=\"g\" hint-placeholder-count=\"1\"><sc-if value=\"{{ g.hl }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:linear-gradient(104deg,rgba(255,238,70,0) 0.9%,rgba(255,238,70,.95) 2.4%,rgba(255,238,70,.55) 5.8%,rgba(255,238,70,.35) 93%,rgba(255,238,70,.85) 96%,rgba(255,238,70,0) 98%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.08em .3em;margin:0 -.3em;border-radius:.6em .3em\">{{ g.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ g.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ g.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:22px;max-width:540px\">\n          <sc-for list=\"{{ s.restSegs }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin:0;font:400 19px/1.5 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\"><sc-for list=\"{{ p.segs }}\" as=\"g\" hint-placeholder-count=\"1\"><sc-if value=\"{{ g.hl }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:linear-gradient(104deg,rgba(255,238,70,0) 0.9%,rgba(255,238,70,.95) 2.4%,rgba(255,238,70,.55) 5.8%,rgba(255,238,70,.35) 93%,rgba(255,238,70,.85) 96%,rgba(255,238,70,0) 98%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.08em .3em;margin:0 -.3em;border-radius:.6em .3em\">{{ g.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ g.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ g.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"margin:120px 64px 0\">\n    <svg sc-camel-view-box=\"0 0 772 10\" width=\"100%\" height=\"10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" stroke-linecap=\"round\" style=\"display:block;filter:url(#wb)\"><path d=\"M2 6c200-5 400-6 768-1\"><\u002Fpath><\u002Fsvg>\n    <svg data-draw=\"\" sc-camel-view-box=\"0 0 400 120\" width=\"100%\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:block;margin-top:40px;filter:url(#wb)\"><sc-for list=\"{{ closeWb }}\" as=\"a\" hint-placeholder-count=\"1\"><path d=\"{{ a.d }}\" stroke=\"{{ a.k }}\" stroke-width=\"{{ a.w }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>\n    <div style=\"padding:40px 0 72px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px\">\n      <div style=\"display:flex;flex-direction:column;gap:28px;align-items:flex-start\"><div style=\"font:400 22px/1.2 'Permanent Marker',cursive;color:#1a1a1a;transform:rotate(-2deg)\">in short →<\u002Fdiv><div style=\"width:176px;padding:18px 16px 24px;background:#b3e5fc;box-shadow:2px 5px 10px rgba(0,0,0,.16);transform:rotate(-3deg);font:400 19px/1.3 'Kalam',cursive;color:#1a1a1a;text-wrap:pretty\">Write it down. Undocumented architecture is folklore.<\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0;font:400 36px/1.2 'Permanent Marker',cursive;max-width:560px;text-wrap:pretty\"><sc-for list=\"{{ closingSegs }}\" as=\"g\" hint-placeholder-count=\"1\"><sc-if value=\"{{ g.hl }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:linear-gradient(104deg,rgba(255,238,70,0) 0.9%,rgba(255,238,70,.95) 2.4%,rgba(255,238,70,.55) 5.8%,rgba(255,238,70,.35) 93%,rgba(255,238,70,.85) 96%,rgba(255,238,70,0) 98%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.08em .3em;margin:0 -.3em;border-radius:.6em .3em\">{{ g.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ g.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ g.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:260px;height:14px;background:#c9ccd0;border-radius:0 0 6px 6px;display:flex;gap:8px;justify-content:center;align-items:center\"><span style=\"width:44px;height:6px;border-radius:3px;background:#1a1a1a\"><\u002Fspan><span style=\"width:44px;height:6px;border-radius:3px;background:#f2e85a\"><\u002Fspan><span style=\"width:44px;height:6px;border-radius:3px;background:#111\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const intro = \"I believe the Technical Director is part architect, part technical advisor, part mentor, and part connector. The role exists to bring technical expertise to bear on the mission, develop the people around it, and ensure technology makes users more capable rather than making their work more complicated.\";\n    const closing = \"Build something worth inheriting and develop the people who will take it farther.\";\n    const raw = [\n      [\"Mission and users come first\", [\"The purpose of technology is to reduce burden, streamline work, enable better decisions, inspire new possibilities, and expand what the mission can accomplish.\", \"Architecture, platforms, standards, and tools are not the objective. They exist to serve the people doing the mission.\", \"I will optimize for mission outcomes and user needs before architectural elegance.\"]],\n      [\"Be pragmatic, not pure\", [\"Architectural purity is a fallacy.\", \"The right solution is the one that responsibly meets the mission need. Sometimes that means an interim capability. Sometimes it means accepting technical debt. Sometimes it means choosing something imperfect because the mission cannot wait.\", \"Those compromises must be deliberate.\", \"Temporary solutions should be constrained and explicitly temporary. Technical debt must be visible, understood, and accompanied by a credible plan to repay it.\", \"We should start simple. Complexity must earn its way into the architecture as the mission demands it.\"]],\n      [\"Security and usability are non-negotiable\", [\"A system that cannot be trusted cannot support the mission.\", \"A system that people cannot effectively use does not support the mission either.\", \"Security and usability are not features to bolt on at the end. They are fundamental properties of good technology.\"]],\n      [\"Own the architecture\", [\"The architecture belongs to the organization.\", \"COTS products should provide capabilities within our architecture; their products should never become the architecture itself.\", \"Technologies, platforms, standards, and systems must continually earn their place. What worked yesterday is not entitled to exist tomorrow simply because it is already there.\", \"The architecture must evolve as the mission evolves.\"]],\n      [\"Push boundaries. Standardize what works.\", [\"Innovation requires experimentation.\", \"We should be willing to push boundaries in both emerging capabilities and the enterprise core when the potential mission value justifies it.\", \"But novelty is not strategy.\", \"We experiment, test, learn, and prove value. When something works, we industrialize it, standardize it, and make it easier for others to use.\", \"We do not solve organizational problems by endlessly buying another tool.\"]],\n      [\"Use technical authority responsibly\", [\"Technical leadership requires judgment and sometimes courage.\", \"I will challenge and advise leaders when I believe we are heading in the wrong direction, even when that position is unpopular.\", \"When I am accountable for the technical direction, I will use the authority of the role when necessary to stop unacceptable security risks, poor user experiences, unnecessary duplication, unsustainable architecture, or decisions that create long-term harm.\", \"But saying no is never enough. If I block a path, I am responsible for helping find the alternative.\"]],\n      [\"Respect the craft\", [\"Technology is both an art and a science.\", \"Technical professionals have an obligation to continually learn, remain current in their craft, think critically, document what matters, challenge assumptions, and understand not just how something works but why it should exist.\", \"Expertise is not knowing everything.\", \"It is having the depth, curiosity, judgment, and discipline to keep learning.\"]],\n      [\"Lead with accountability\", [\"If something I champion fails, I own it publicly.\", \"Then we all learn from it and fix it.\", \"Leadership means giving teams room to experiment without making them carry the consequences alone. Success belongs to the team. Accountability belongs to leadership.\"]],\n      [\"Build people, not dependency\", [\"One of the Technical Director's most important responsibilities is developing the technical leaders who come next.\", \"I want engineers and architects working with me to experience leadership that is collaborative, knowledgeable, fair, demanding, and relentlessly focused on the user.\", \"The organization should eventually be able to succeed without me.\", \"My goal is not to make myself indispensable. My goal is to leave behind stronger people, stronger technical judgment, stronger standards, and a healthier architecture.\"]],\n      [\"Leave something worth inheriting\", [\"Success is not simply delivering systems.\", \"It is leaving behind an environment that is more integrated, more usable, more secure, less dependent on individual vendors, easier to change, and better able to respond to the mission.\", \"It is leaving behind people capable of taking it further.\", \"I want the Technical Director role to become something people fight to inherit, not because of the title, but because they believe in what has been built and want to carry it forward.\"]]\n    ];\n    const romans = [\"I\",\"II\",\"III\",\"IV\",\"V\",\"VI\",\"VII\",\"VIII\",\"IX\",\"X\"];\n    const sections = raw.map(([title, paras], i) => ({\n      title, paras, num: String(i + 1).padStart(2, \"0\"), roman: romans[i], lede: paras[0], rest: paras.slice(1)\n    }));\n    const seg = (text, phrases) => {\n      let parts = [{ t: text, hl: false, plain: true }];\n      for (const ph of phrases) {\n        const next = [];\n        for (const p of parts) {\n          if (p.hl) { next.push(p); continue; }\n          const i = p.t.indexOf(ph);\n          if (i < 0) { next.push(p); continue; }\n          if (i > 0) next.push({ t: p.t.slice(0, i), hl: false, plain: true });\n          next.push({ t: ph, hl: true, plain: false });\n          if (i + ph.length < p.t.length) next.push({ t: p.t.slice(i + ph.length), hl: false, plain: true });\n        }\n        parts = next;\n      }\n      return parts;\n    };\n    const keys = [\n      [\"serve the people doing the mission\", \"mission outcomes and user needs\"],\n      [\"Architectural purity is a fallacy.\", \"deliberate\", \"start simple\"],\n      [\"cannot be trusted\", \"cannot effectively use\", \"fundamental properties\"],\n      [\"belongs to the organization\", \"never become the architecture itself\", \"continually earn their place\"],\n      [\"novelty is not strategy\", \"industrialize it, standardize
